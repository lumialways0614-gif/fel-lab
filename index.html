<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首集实验室 · 正在进入</title>
<!--
  备用中转页：把 TARGET 换成真正的部署地址后，丢到 Cloudflare Pages / Netlify / Vercel，
  一分钟就能得到一个能念出来的短地址（例如 first-episode-lab.pages.dev），它 302 跳到主站。
  Netlify / Pages 还会读同目录的 _redirects，把 /go 也直接跳过去。
-->
<script>
  var TARGET = "https://speaks-reporters-tennis-dreams.trycloudflare.com/";
  if (location.protocol !== "file:") {
    setTimeout(function () { location.replace(TARGET); }, 1200);
  }
</script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f7f3ea; color: #1c1a17;
    font: 16px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .card { max-width: 30rem; width: 100%; }
  h1 { font-size: 1.6rem; letter-spacing: -0.01em; margin: 0 0 8px; }
  p { color: #57514a; margin: 0 0 20px; }
  a.btn {
    display: inline-block; background: #1c1a17; color: #fff; text-decoration: none;
    padding: 13px 22px; border-radius: 6px; font-weight: 600;
  }
  a.btn:hover { background: #33302b; }
  code { font-size: 0.85em; background: #eae3d6; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .bar { height: 2px; background: #d9d1c2; margin-top: 24px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; background: #1c1a17; animation: go 1.2s ease-in-out forwards; }
  @keyframes go { from { width: 0 } to { width: 100% } }
</style>
</head>
<body>
  <div class="card">
    <h1>首集实验室</h1>
    <p>正在进入演示站…如果没有自动跳转，点下面的按钮。</p>
    <p><a class="btn" id="go" href="#">进入网站 →</a></p>
    <p style="font-size:.85rem">目标地址：<code id="t"></code></p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    var t = document.getElementById("t");
    var go = document.getElementById("go");
    t.textContent = TARGET;
    go.href = TARGET;
  </script>
</body>
</html>
